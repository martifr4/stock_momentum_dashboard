<title>Reddit Momentum Dashboard</title>
<style>
  :root {
    --surface-1: #fcfcfb;
    --page: #f4f4f1;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --baseline: #c3c2b7;
    --border: rgba(11,11,11,0.10);
    --blue: #2a78d6;
    --blue-soft: #cde2fb;
    --bull: #0ca30c;
    --bull-text: #006300;
    --bear: #d03b3b;
    --neutral: #898781;
    --shadow: 0 1px 2px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface-1: #1a1a19;
      --page: #0d0d0d;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --baseline: #383835;
      --border: rgba(255,255,255,0.10);
      --blue: #3987e5;
      --blue-soft: #184f95;
      --bull: #0ca30c;
      --bull-text: #0ca30c;
      --bear: #d03b3b;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 20px rgba(0,0,0,0.4);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--text-primary);
    font-size: 14px;
    line-height: 1.45;
  }
  a { color: var(--blue); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 20px 20px 60px; }

  header.top {
    display: flex; align-items: baseline; justify-content: space-between;
    flex-wrap: wrap; gap: 12px; margin-bottom: 6px;
  }
  header.top h1 { font-size: 22px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
  header.top .sub { color: var(--muted); font-size: 12.5px; }

  .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 14px 0 20px; }
  .seg { display: inline-flex; background: var(--surface-1); border: 1px solid var(--border); border-radius: 9px; overflow: hidden; box-shadow: var(--shadow); }
  .seg button {
    border: 0; background: transparent; color: var(--text-secondary);
    padding: 7px 15px; font-size: 13px; cursor: pointer; font-family: inherit;
    border-right: 1px solid var(--border);
  }
  .seg button:last-child { border-right: 0; }
  .seg button.active { background: var(--blue); color: #fff; font-weight: 600; }
  .seg button:hover:not(.active) { background: var(--grid); }
  .btn {
    border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary);
    padding: 7px 14px; border-radius: 9px; cursor: pointer; font-size: 13px; font-family: inherit;
    box-shadow: var(--shadow);
  }
  .btn:hover { background: var(--grid); }
  .btn:disabled { opacity: 0.55; cursor: default; }
  .status { color: var(--muted); font-size: 12px; margin-left: auto; text-align: right; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 12px; }
  .srcstrip { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  .srcchip { display: inline-flex; align-items: center; gap: 6px; background: var(--surface-1); border: 1px solid var(--border); border-radius: 999px; padding: 4px 11px; font-size: 12px; box-shadow: var(--shadow); }
  .srcchip .dot { width: 8px; height: 8px; border-radius: 50%; }
  .srcchip b { font-variant-numeric: tabular-nums; }
  .srcchip .s { color: var(--muted); font-size: 11px; }
  .src-tag { font-size: 10px; padding: 1px 6px; border-radius: 6px; font-weight: 600; color: #fff; letter-spacing: 0.02em; }
  .tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow); }
  .tile .lbl { color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.04em; }
  .tile .val { font-size: 26px; font-weight: 650; margin-top: 4px; letter-spacing: -0.02em; }
  .tile .val.tab { font-variant-numeric: tabular-nums; }

  .grid2 { display: grid; grid-template-columns: 1.15fr 1fr; gap: 18px; align-items: start; }
  @media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }

  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
  .card h2 { font-size: 14px; margin: 0; padding: 14px 16px 10px; font-weight: 620; }
  .card h2 small { color: var(--muted); font-weight: 400; font-size: 12px; }

  table { width: 100%; border-collapse: collapse; }
  thead th { text-align: right; font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); font-weight: 600; padding: 6px 12px; border-bottom: 1px solid var(--border); }
  thead th.l { text-align: left; }
  tbody td { padding: 8px 12px; border-bottom: 1px solid var(--grid); text-align: right; font-variant-numeric: tabular-nums; }
  tbody td.l { text-align: left; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--grid); }
  tbody tr.sel { background: color-mix(in srgb, var(--blue) 12%, transparent); }
  .tk { font-weight: 650; font-size: 13.5px; }
  .badge-new { font-size: 9.5px; background: var(--blue); color: #fff; padding: 1px 5px; border-radius: 6px; margin-left: 6px; vertical-align: middle; letter-spacing: 0.03em; }

  .mom { font-weight: 600; font-variant-numeric: tabular-nums; }
  .mom.up { color: var(--bull-text); }
  .mom.down { color: var(--bear); }
  .mom.flat { color: var(--muted); }

  /* Sentiment meter: diverging bar centered at 0 */
  .meter { display: inline-block; width: 90px; height: 12px; background: var(--grid); border-radius: 3px; position: relative; vertical-align: middle; }
  .meter::before { content: ""; position: absolute; left: 50%; top: -1px; bottom: -1px; width: 1px; background: var(--baseline); }
  .meter i { position: absolute; top: 0; bottom: 0; border-radius: 2px; }

  .detail-empty { padding: 40px 16px; color: var(--muted); text-align: center; font-size: 13px; }
  .chart-block { padding: 6px 12px 14px; }
  .chart-block .clab { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; padding: 8px 4px 2px; }
  svg.chart { width: 100%; display: block; overflow: visible; }

  .posts { padding: 4px 4px 8px; }
  .post { padding: 9px 12px; border-bottom: 1px solid var(--grid); }
  .post:last-child { border-bottom: 0; }
  .post .meta { font-size: 11px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .post .ttl { font-size: 13px; margin: 2px 0; }
  .pill { font-size: 10px; padding: 1px 6px; border-radius: 6px; font-weight: 600; }
  .pill.bull { background: color-mix(in srgb, var(--bull) 18%, transparent); color: var(--bull-text); }
  .pill.bear { background: color-mix(in srgb, var(--bear) 18%, transparent); color: var(--bear); }
  .pill.neut { background: var(--grid); color: var(--text-secondary); }

  .tip { position: fixed; pointer-events: none; background: var(--text-primary); color: var(--surface-1); padding: 5px 8px; border-radius: 6px; font-size: 11.5px; opacity: 0; transition: opacity .08s; z-index: 50; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .legend { display: flex; gap: 14px; font-size: 11.5px; color: var(--text-secondary); padding: 2px 12px 6px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .banner { background: color-mix(in srgb, var(--bear) 14%, var(--surface-1)); border: 1px solid var(--border); color: var(--text-primary); padding: 10px 14px; border-radius: 10px; margin-bottom: 16px; font-size: 13px; }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Reddit Momentum Dashboard</h1>
      <div class="sub">What investment forums are buzzing about — mentions, sentiment &amp; momentum</div>
    </div>
    <div class="status" id="status">loading…</div>
  </header>

  <div id="banner"></div>

  <div class="controls">
    <div class="seg" id="windowSeg">
      <button data-w="daily">Daily</button>
      <button data-w="weekly" class="active">Weekly</button>
      <button data-w="monthly">Monthly</button>
      <button data-w="yearly">Yearly</button>
    </div>
    <div class="seg" id="sourceSeg"></div>
    <button class="btn" id="refreshBtn">↻ Refresh</button>
    <button class="btn" id="ingestBtn">⤓ Pull new data</button>
  </div>

  <div class="kpis" id="kpis"></div>
  <div class="srcstrip" id="srcstrip"></div>

  <div class="grid2">
    <div class="card">
      <h2>Top Movers <small id="moversSub"></small></h2>
      <div style="overflow-x:auto">
        <table id="moversTable">
          <thead><tr>
            <th class="l">Ticker</th>
            <th>Mentions</th>
            <th>Momentum</th>
            <th class="l">Sentiment</th>
            <th>Buzz</th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <div class="card" id="detailCard">
      <h2 id="detailTitle">Select a ticker</h2>
      <div id="detailBody"><div class="detail-empty">Click a ticker on the left to see its mention &amp; sentiment trend and the posts driving the buzz.</div></div>
    </div>
  </div>
</div>

<div class="tip" id="tip"></div>

<script>
const $ = s => document.querySelector(s);
const tip = $("#tip");
let state = { window: "weekly", ticker: null, source: "all" };

// source -> {label, color}
const SOURCE_META = {
  all:        { label: "All sources", color: "var(--blue)" },
  stocktwits: { label: "StockTwits",  color: "#1baf7a" },
  reddit:     { label: "Reddit",      color: "#eb6834" },
  hackernews: { label: "Hacker News", color: "#e8a13a" },
  yahoo_news: { label: "Yahoo News",  color: "#7a5af5" },
  demo:       { label: "Demo data",   color: "#898781" },
};
const srcMeta = s => SOURCE_META[s] || { label: s, color: "var(--muted)" };
const srcParam = () => state.source && state.source !== "all" ? `&source=${state.source}` : "";

const fmtNum = n => n >= 1000 ? (n/1000).toFixed(1).replace(/\.0$/,"")+"k" : String(n);
const sentColor = s => s >= 0.25 ? "var(--bull)" : s <= -0.25 ? "var(--bear)" : "var(--neutral)";
const sentLabel = s => s >= 0.25 ? "bull" : s <= -0.25 ? "bear" : "neut";

function fmtTime(ts, win) {
  const d = new Date(ts * 1000);
  if (win === "daily") return d.toLocaleTimeString([], {hour: "numeric"});
  if (win === "yearly") return d.toLocaleDateString([], {month: "short", day: "numeric"});
  return d.toLocaleDateString([], {month: "short", day: "numeric"});
}

async function getJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

function showTip(e, html) {
  tip.innerHTML = html;
  tip.style.opacity = 1;
  const pad = 12;
  let x = e.clientX + pad, y = e.clientY + pad;
  if (x + tip.offsetWidth > window.innerWidth) x = e.clientX - tip.offsetWidth - pad;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
function hideTip() { tip.style.opacity = 0; }

// ---- Bar chart (mentions over time), sequential blue ----
function barChart(labels, values, win) {
  const W = 460, H = 150, padL = 30, padR = 8, padT = 10, padB = 22;
  const iw = W - padL - padR, ih = H - padT - padB;
  const max = Math.max(1, ...values);
  const n = values.length;
  const bw = Math.max(1, iw / n - 2);
  const yTicks = 3;
  let grid = "";
  for (let i = 0; i <= yTicks; i++) {
    const v = Math.round(max * i / yTicks);
    const y = padT + ih - (v / max) * ih;
    grid += `<line x1="${padL}" x2="${W - padR}" y1="${y}" y2="${y}" stroke="var(--grid)" stroke-width="1"/>`;
    grid += `<text x="${padL - 5}" y="${y + 3}" text-anchor="end" font-size="9.5" fill="var(--muted)">${v}</text>`;
  }
  let bars = "";
  values.forEach((v, i) => {
    const h = (v / max) * ih;
    const x = padL + i * (iw / n) + 1;
    const y = padT + ih - h;
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0,h).toFixed(1)}" rx="2" fill="var(--blue)" class="bar" data-i="${i}"/>`;
  });
  // sparse x labels
  let xl = "";
  const step = Math.ceil(n / 6);
  for (let i = 0; i < n; i += step) {
    const x = padL + i * (iw / n) + bw / 2 + 1;
    xl += `<text x="${x.toFixed(1)}" y="${H - 6}" text-anchor="middle" font-size="9" fill="var(--muted)">${fmtTime(labels[i], win)}</text>`;
  }
  const svg = `<svg class="chart" viewBox="0 0 ${W} ${H}">${grid}${bars}${xl}</svg>`;
  return { svg, attach(el){ el.querySelectorAll(".bar").forEach(b => {
    b.addEventListener("mousemove", e => { const i=+b.dataset.i; showTip(e, `<b>${values[i]}</b> mentions<br>${fmtTime(labels[i],win)}`); });
    b.addEventListener("mouseleave", hideTip);
  }); } };
}

// ---- Line chart (sentiment over time), diverging around 0 ----
function lineChart(labels, values, win) {
  const W = 460, H = 130, padL = 30, padR = 8, padT = 10, padB = 22;
  const iw = W - padL - padR, ih = H - padT - padB;
  const n = values.length;
  const y0 = padT + ih / 2; // sentiment 0 in the middle (range -1..1)
  const yFor = v => padT + ih/2 - (v||0) * (ih/2);
  const xFor = i => n <= 1 ? padL + iw/2 : padL + (i/(n-1)) * iw;
  // zero baseline + guides
  let grid = `<line x1="${padL}" x2="${W-padR}" y1="${y0}" y2="${y0}" stroke="var(--baseline)" stroke-width="1.5"/>`;
  [[1,"+1"],[-1,"-1"]].forEach(([v,t]) => {
    grid += `<text x="${padL-5}" y="${yFor(v)+3}" text-anchor="end" font-size="9.5" fill="var(--muted)">${t}</text>`;
  });
  // build path over points that have data
  const pts = values.map((v,i) => ({v, i, has: v !== null && v !== undefined}));
  let d = "", started = false;
  pts.forEach(p => {
    if (!p.has) { started = false; return; }
    const x = xFor(p.i), y = yFor(p.v);
    d += (started ? " L" : " M") + x.toFixed(1) + " " + y.toFixed(1);
    started = true;
  });
  const line = d ? `<path d="${d}" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>` : "";
  let dots = "";
  pts.forEach(p => { if (!p.has) return;
    dots += `<circle cx="${xFor(p.i).toFixed(1)}" cy="${yFor(p.v).toFixed(1)}" r="3.2" fill="${sentColor(p.v)}" stroke="var(--surface-1)" stroke-width="1.5" class="dot" data-i="${p.i}"/>`;
  });
  let xl = "";
  const step = Math.ceil(n / 6);
  for (let i = 0; i < n; i += step) {
    xl += `<text x="${xFor(i).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="9" fill="var(--muted)">${fmtTime(labels[i], win)}</text>`;
  }
  const svg = `<svg class="chart" viewBox="0 0 ${W} ${H}">${grid}${line}${dots}${xl}</svg>`;
  return { svg, attach(el){ el.querySelectorAll(".dot").forEach(dot => {
    dot.addEventListener("mousemove", e => { const i=+dot.dataset.i; const v=values[i]; showTip(e, `<b>${v>0?"+":""}${v.toFixed(2)}</b> ${sentLabel(v)}<br>${fmtTime(labels[i],win)}`); });
    dot.addEventListener("mouseleave", hideTip);
  }); } };
}

function meter(s) {
  const half = 45; // px per side of 90px meter
  const w = Math.min(1, Math.abs(s)) * half;
  const style = s >= 0
    ? `left:50%;width:${w}px;background:${s>=0.25?'var(--bull)':'var(--neutral)'};`
    : `right:50%;width:${w}px;background:${s<=-0.25?'var(--bear)':'var(--neutral)'};`;
  return `<span class="meter" title="${s.toFixed(2)}"><i style="${style}"></i></span>`;
}

function momCell(m, isNew) {
  if (isNew) return `<span class="mom up">NEW</span>`;
  const pct = Math.round(m * 100);
  const show = a => a > 999 ? ">999" : String(a);
  if (pct > 4) return `<span class="mom up">▲ ${show(pct)}%</span>`;
  if (pct < -4) return `<span class="mom down">▼ ${show(Math.abs(pct))}%</span>`;
  return `<span class="mom flat">— ${pct}%</span>`;
}

function renderBreakdown(breakdown) {
  const strip = $("#srcstrip");
  if (!breakdown || !breakdown.length) { strip.innerHTML = ""; return; }
  strip.innerHTML = breakdown.map(b => {
    const m = srcMeta(b.source);
    const sc = b.avg_sent >= 0.25 ? "var(--bull)" : b.avg_sent <= -0.25 ? "var(--bear)" : "var(--neutral)";
    return `<span class="srcchip"><span class="dot" style="background:${m.color}"></span>${m.label} <b>${fmtNum(b.mentions)}</b> <span class="s" style="color:${sc}">${b.avg_sent>0?'+':''}${(b.avg_sent||0).toFixed(2)}</span></span>`;
  }).join("");
}

async function loadOverview() {
  const o = await getJSON(`/api/overview?window=${state.window}${srcParam()}`);
  renderBreakdown(o.breakdown);
  const total = o.bullish + o.bearish + o.neutral || 1;
  const kpis = [
    ["Total mentions", fmtNum(o.total_mentions), true],
    ["Unique tickers", fmtNum(o.unique_tickers), true],
    ["Avg sentiment", (o.avg_sentiment>0?"+":"")+o.avg_sentiment.toFixed(2), false, sentColor(o.avg_sentiment)],
    ["Bull / Bear", `${Math.round(o.bullish/total*100)}% / ${Math.round(o.bearish/total*100)}%`, false],
  ];
  $("#kpis").innerHTML = kpis.map(([l,v,tab,color]) =>
    `<div class="tile"><div class="lbl">${l}</div><div class="val ${tab?'tab':''}" ${color?`style="color:${color}"`:''}>${v}</div></div>`
  ).join("");
}

async function loadMovers() {
  const rows = await getJSON(`/api/movers?window=${state.window}&limit=30${srcParam()}`);
  $("#moversSub").textContent = `· ${rows.length} tickers · by buzz`;
  const tb = $("#moversTable tbody");
  if (!rows.length) {
    tb.innerHTML = `<tr><td class="l" colspan="5" style="color:var(--muted);padding:24px 12px">No data yet for this window. Click “Pull new Reddit data”.</td></tr>`;
    return;
  }
  tb.innerHTML = rows.map(r => `
    <tr data-tk="${r.ticker}" class="${r.ticker===state.ticker?'sel':''}">
      <td class="l"><span class="tk">${r.ticker}</span>${r.is_new?'<span class="badge-new">NEW</span>':''}</td>
      <td>${fmtNum(r.mentions)}</td>
      <td>${momCell(r.momentum, r.is_new)}</td>
      <td class="l">${meter(r.weighted_sentiment)} <span style="color:${sentColor(r.weighted_sentiment)};font-size:12px">${r.weighted_sentiment>0?'+':''}${r.weighted_sentiment.toFixed(2)}</span></td>
      <td>${fmtNum(Math.round(r.buzz))}</td>
    </tr>`).join("");
  tb.querySelectorAll("tr[data-tk]").forEach(tr =>
    tr.addEventListener("click", () => selectTicker(tr.dataset.tk)));
}

async function selectTicker(tk) {
  state.ticker = tk;
  document.querySelectorAll("#moversTable tbody tr").forEach(tr =>
    tr.classList.toggle("sel", tr.dataset.tk === tk));
  $("#detailTitle").innerHTML = `${tk} <small style="color:var(--muted);font-weight:400">· ${state.window}</small>`;
  const body = $("#detailBody");
  body.innerHTML = `<div class="detail-empty">Loading ${tk}…</div>`;
  const data = await getJSON(`/api/ticker?symbol=${encodeURIComponent(tk)}&window=${state.window}${srcParam()}`);
  const s = data.series;
  const bc = barChart(s.labels, s.mentions, state.window);
  const lc = lineChart(s.labels, s.sentiment, state.window);
  const postsHtml = data.posts.length ? data.posts.map(p => {
    const lab = sentLabel(p.sentiment);
    const pill = lab==="bull"?"bull":lab==="bear"?"bear":"neut";
    const m = srcMeta(p.source);
    // origin label: subreddit for reddit/demo, else source-specific
    const origin = (p.source==="reddit"||p.source==="demo") ? `r/${p.subreddit}`
                 : p.source==="stocktwits" ? `@${p.author||'user'}`
                 : p.source==="yahoo_news" ? "headline" : "HN";
    const scoreBit = p.score>0 ? `<span>·</span><span>▲ ${fmtNum(p.score)}</span>` : "";
    return `<div class="post">
      <div class="meta"><span class="pill ${pill}">${p.sentiment>0?'+':''}${p.sentiment.toFixed(2)}</span>
        <span class="src-tag" style="background:${m.color}">${m.label}</span>
        <span>${origin}</span>${scoreBit}<span>·</span><span>${p.kind}</span></div>
      <div class="ttl"><a href="${p.permalink}" target="_blank" rel="noopener">${(p.snippet||"(no text)").replace(/</g,"&lt;")}</a></div>
    </div>`;
  }).join("") : `<div class="detail-empty">No posts found.</div>`;

  body.innerHTML = `
    <div class="chart-block">
      <div class="clab">Mentions over time</div><div id="bc"></div>
    </div>
    <div class="chart-block">
      <div class="clab">Average sentiment over time</div><div id="lc"></div>
      <div class="legend"><span><span class="swatch" style="background:var(--bull)"></span>bullish</span><span><span class="swatch" style="background:var(--neutral)"></span>neutral</span><span><span class="swatch" style="background:var(--bear)"></span>bearish</span></div>
    </div>
    <h2 style="border-top:1px solid var(--border)">Posts driving the buzz</h2>
    <div class="posts">${postsHtml}</div>`;
  $("#bc").innerHTML = bc.svg; bc.attach($("#bc"));
  $("#lc").innerHTML = lc.svg; lc.attach($("#lc"));
}

function buildSourceSelector(sources) {
  const seg = $("#sourceSeg");
  const opts = ["all", ...sources];
  const wanted = opts.join(",");
  if (seg.dataset.built === wanted) return;   // rebuild only when set changes
  seg.dataset.built = wanted;
  seg.innerHTML = opts.map(s =>
    `<button data-src="${s}" class="${s===state.source?'active':''}">${srcMeta(s).label}</button>`
  ).join("");
  seg.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
    state.source = b.dataset.src;
    seg.querySelectorAll("button").forEach(x => x.classList.toggle("active", x===b));
    refresh();
  }));
}

async function loadStatus() {
  try {
    const s = await getJSON("/api/status");
    buildSourceSelector(s.sources || []);
    let txt = `${fmtNum(s.total_mentions)} mentions · ${fmtNum(s.total_posts)} posts stored`;
    if (s.last_run && s.last_run.finished_at) {
      const ago = Math.round((Date.now()/1000 - s.last_run.finished_at)/60);
      txt += ` · last pull ${ago<60?ago+'m':Math.round(ago/60)+'h'} ago`;
    }
    $("#status").textContent = txt;
    if (s.total_mentions === 0) {
      $("#banner").innerHTML = `<div class="banner">No data yet. Click <b>“Pull new Reddit data”</b> (or run <code>python backend/ingest.py</code>) to populate the dashboard. Longer windows fill in as you keep pulling over days/weeks.</div>`;
    } else {
      $("#banner").innerHTML = "";
    }
    if (s.ingest && s.ingest.running) {
      $("#ingestBtn").disabled = true;
      $("#ingestBtn").textContent = "⏳ Pulling…";
    } else {
      $("#ingestBtn").disabled = false;
      $("#ingestBtn").textContent = "⤓ Pull new data";
    }
    return s;
  } catch(e) { $("#status").textContent = "server offline"; }
}

async function refresh() {
  await Promise.all([loadOverview(), loadMovers(), loadStatus()]);
  if (state.ticker) await selectTicker(state.ticker);
}

// Wire up controls
$("#windowSeg").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  state.window = b.dataset.w;
  document.querySelectorAll("#windowSeg button").forEach(x => x.classList.toggle("active", x===b));
  refresh();
});
$("#refreshBtn").addEventListener("click", refresh);
$("#ingestBtn").addEventListener("click", async () => {
  await fetch("/api/ingest", {method:"POST"});
  $("#ingestBtn").disabled = true;
  $("#ingestBtn").textContent = "⏳ Pulling…";
  const poll = setInterval(async () => {
    const s = await loadStatus();
    if (s && s.ingest && !s.ingest.running) { clearInterval(poll); refresh(); }
  }, 3000);
});

refresh();
setInterval(loadStatus, 30000);
</script>
